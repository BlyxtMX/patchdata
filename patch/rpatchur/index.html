<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RO Puerto Vallarta</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: #eef6ff;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        linear-gradient(90deg, rgba(2,8,16,.70), rgba(4,13,25,.42) 48%, rgba(2,8,16,.66)),
        linear-gradient(0deg, rgba(1,7,14,.60), transparent 52%),
        url("https://raw.githubusercontent.com/BlyxtMX/patchdata/main/patch/rpatchur/images/fantasy-bg.jpg") center center / cover no-repeat,
        #06101e;
    }
    button { font: inherit; }
    button svg { width: 18px; height: 18px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .shell { position: relative; height: 100%; min-height: 580px; padding: 26px 34px 28px; }
    .glow {
      position: absolute; top: -170px; left: 50%; width: 600px; height: 600px;
      margin-left: -300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(18, 127, 220, .17), transparent 68%);
      pointer-events: none;
    }
    .topbar { position: relative; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
    .brand { display: flex; align-items: center; letter-spacing: .16em; text-transform: uppercase; }
    .brand-mark { width: 8px; height: 8px; margin-right: 10px; background: #efbd55; transform: rotate(45deg); box-shadow: 0 0 12px rgba(239,189,85,.75); }
    .brand strong { color: #fff; font-size: 13px; font-weight: 600; }
    .brand span { color: #7691ad; margin-left: 8px; font-size: 11px; }
    .icon-button {
      width: 34px; height: 34px; border: 1px solid rgba(164,190,218,.18); border-radius: 9px;
      color: #91a9c0; background: rgba(7,18,32,.48); cursor: pointer; transition: .2s;
    }
    .icon-button:hover { color: #fff; border-color: rgba(239,189,85,.55); background: rgba(18,40,66,.8); }
    .hero { position: relative; z-index: 1; display: flex; height: calc(100% - 66px); align-items: center; }
    .identity { width: 48%; text-align: center; padding: 0 26px 15px 0; }
    .logo { display: block; width: 100%; max-width: 430px; max-height: 355px; margin: 0 auto; object-fit: contain; filter: drop-shadow(0 22px 30px rgba(0,0,0,.42)); transform-origin: center; transition: transform .35s ease, filter .35s ease; }
    .logo:hover { transform: translateY(-3px) scale(1.025); animation: logo-glow 1.7s ease-in-out infinite; }
    .tagline { margin: -3px 0 0; color: #89a2ba; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
    .panel {
      width: 52%; max-width: 430px; margin-left: auto; padding: 31px;
      border: 1px solid rgba(142,174,206,.16); border-radius: 20px;
      background: rgba(5,15,27,.68); box-shadow: 0 26px 70px rgba(0,0,0,.32);
    }
    .eyebrow { color: #e7b958; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 9px 0 8px; color: #fff; font-size: 27px; font-weight: 600; }
    .copy { min-height: 42px; margin: 0 0 25px; color: #8199af; font-size: 13px; line-height: 1.6; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 7px; background: #14283d; }
    .progress-bar { width: 0; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #156fbd, #3cb8ff); box-shadow: 0 0 16px rgba(42,159,229,.45); transition: width .25s ease; }
    .status-row { display: flex; justify-content: space-between; margin: 10px 0 28px; color: #738ba2; font-size: 11px; }
    .status-row strong { color: #a9bdd0; font-weight: 500; }
    .actions { display: flex; gap: 16px; }
    .button { position: relative; height: 44px; overflow: hidden; border-radius: 11px; cursor: pointer; transition: transform .18s ease, filter .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .button svg { overflow: visible; transition: transform .35s ease, filter .25s ease; transform-origin: center; }
    .button:active { transform: translateY(1px) scale(.97); }
    .play {
      flex: 1; border: 1px solid #e7b958; color: #06101d; font-weight: 700;
      background: linear-gradient(135deg, #f3cf76, #d89a35); box-shadow: 0 8px 22px rgba(207,146,44,.2);
    }
    .play:before {
      content: ""; position: absolute; top: -70%; left: -35%; width: 25%; height: 240%;
      background: rgba(255,255,255,.52); transform: rotate(22deg); opacity: 0;
    }
    .play:hover { filter: brightness(1.09); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(225,168,64,.38); }
    .play:hover:before { opacity: 1; animation: button-shine .7s ease forwards; }
    .play:hover svg { transform: rotate(-8deg) scale(1.14); filter: drop-shadow(0 0 4px rgba(255,255,255,.65)); }
    .play:not(:disabled) { animation: play-breathe 2.8s ease-in-out infinite; }
    .play:not(:disabled) svg { animation: bow-alive 2.4s ease-in-out infinite; }
    .play:not(:disabled) .icon-spark { animation: icon-sparkle 1.6s ease-in-out infinite; transform-origin: 18px 5px; }
    .play:disabled { color: #607081; border-color: #243b51; background: #162a3d; box-shadow: none; cursor: default; transform: none; }
    .secondary { width: 48px; border: 1px solid rgba(151,181,211,.2); color: #9cb3c8; background: rgba(18,38,58,.7); }
    .secondary:hover { color: #fff; border-color: rgba(239,189,85,.7); background: rgba(29,58,86,.92); box-shadow: 0 8px 20px rgba(0,0,0,.28), 0 0 14px rgba(33,145,220,.16); transform: translateY(-2px); }
    .secondary[title="Configuración"] svg { animation: gear-turn 5s linear infinite; }
    .secondary[title="Configuración"]:hover svg { animation-duration: 1.4s; filter: drop-shadow(0 0 4px rgba(239,189,85,.7)); }
    .secondary[title="Reintentar"] svg { animation: refresh-turn 2.8s cubic-bezier(.55,.05,.35,.95) infinite; }
    .secondary[title="Reintentar"]:hover svg { animation-duration: 1s; filter: drop-shadow(0 0 4px rgba(70,182,255,.75)); }
    @keyframes button-shine { from { left: -35%; } to { left: 125%; } }
    @keyframes play-breathe {
      0%, 100% { box-shadow: 0 8px 22px rgba(207,146,44,.20); }
      50% { box-shadow: 0 9px 28px rgba(232,177,70,.40), 0 0 13px rgba(239,189,85,.16); }
    }
    @keyframes bow-alive {
      0%, 100% { transform: translateY(1px) rotate(-4deg); }
      45% { transform: translateY(-2px) rotate(3deg) scale(1.07); }
      55% { transform: translateY(-2px) rotate(1deg) scale(1.07); }
    }
    @keyframes icon-sparkle {
      0%, 35%, 100% { opacity: .15; transform: scale(.55) rotate(0deg); }
      55% { opacity: 1; transform: scale(1.25) rotate(90deg); }
      75% { opacity: .25; transform: scale(.7) rotate(180deg); }
    }
    @keyframes gear-turn { to { transform: rotate(360deg); } }
    @keyframes refresh-turn {
      0%, 20% { transform: rotate(0deg); }
      72%, 100% { transform: rotate(360deg); }
    }
    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 22px 30px rgba(0,0,0,.42)) drop-shadow(0 0 7px rgba(234,174,61,.34)) drop-shadow(0 0 9px rgba(35,142,231,.22)); }
      50% { filter: drop-shadow(0 24px 31px rgba(0,0,0,.46)) drop-shadow(0 0 16px rgba(247,198,90,.70)) drop-shadow(0 0 20px rgba(42,162,255,.48)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .button, .button svg, .play:not(:disabled), .logo:hover { animation: none; transition: none; }
    }
    .footer { position: absolute; right: 34px; bottom: 15px; color: #42586d; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    @media (max-width: 720px) {
      .shell { padding: 18px; }
      .hero { display: block; padding-top: 16px; overflow: auto; }
      .identity, .panel { width: 100%; max-width: 440px; margin: 0 auto; }
      .identity { padding: 0; }
      .logo { max-height: 245px; }
      .panel { padding: 23px; }
      .footer { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="glow"></div>
    <header class="topbar">
      <div class="brand"><i class="brand-mark"></i><strong>RO PV</strong><span>Launcher</span></div>
      <button class="icon-button" type="button" title="Cerrar" onclick="external.invoke('exit')">&#10005;</button>
    </header>

    <main class="hero">
      <section class="identity">
        <img class="logo" src="https://raw.githubusercontent.com/BlyxtMX/patchdata/main/patch/rpatchur/images/ro-pv-logo.png" alt="RO Puerto Vallarta">
        <p class="tagline">Tu aventura comienza aquí</p>
      </section>

      <section class="panel">
        <div class="eyebrow">Actualizador oficial</div>
        <h1>Bienvenido, aventurero</h1>
        <p class="copy">Mantén tu cliente actualizado y prepárate para entrar a RO Puerto Vallarta.</p>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <div class="status-row"><strong id="status-text">Buscando actualizaciones...</strong><span id="status-percent">0%</span></div>
        <div class="actions">
          <button id="button-play" class="button play" type="button" onclick="external.invoke('play')" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3c5 4.3 5 13.7 0 18M6 3c8 2.2 12 7.2 12 9s-4 6.8-12 9M6 3v18"/><path d="M4 12h15M16 9l3 3-3 3"/><path class="icon-spark" d="M20 4v3M18.5 5.5h3"/></svg>
            &nbsp; JUGAR AHORA
          </button>
          <button class="button secondary" type="button" title="Configuración" onclick="external.invoke('setup')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          </button>
          <button class="button secondary" type="button" title="Reintentar" onclick="external.invoke('start_update')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M18.5 16a8 8 0 1 1 .8-8.7L20 12"/></svg>
          </button>
        </div>
      </section>
    </main>
    <div class="footer">RO Puerto Vallarta &middot; RPatchur</div>
  </div>

  <script>
    function setProgress(percent, text, state) {
      var value = Math.max(0, Math.min(100, isFinite(percent) ? percent : 0));
      var bar = document.getElementById('progress-bar');
      bar.style.width = value + '%';
      bar.style.background = state === 'error' ? '#d95d5d' : state === 'ready' ? 'linear-gradient(90deg,#28a66a,#69d49d)' : 'linear-gradient(90deg,#156fbd,#3cb8ff)';
      document.getElementById('status-text').innerText = text;
      document.getElementById('status-percent').innerText = Math.round(value) + '%';
    }
    function patchingStatusReady() {
      setProgress(100, 'Tu cliente está actualizado', 'ready');
      document.getElementById('button-play').disabled = false;
    }
    function patchingStatusError(errorMsg) {
      setProgress(100, 'Error: ' + errorMsg, 'error');
    }
    function patchingStatusDownloading(nbDownloaded, nbTotal, bytesPerSec) {
      var percent = nbTotal > 0 ? (100 * nbDownloaded / nbTotal) : 0;
      var speed = bytesPerSec > 0 ? ' · ' + humanFileSize(bytesPerSec) + '/s' : '';
      setProgress(percent, 'Descargando ' + nbDownloaded + ' de ' + nbTotal + speed);
    }
    function patchingStatusInstalling(nbInstalled, nbTotal) {
      var percent = nbTotal > 0 ? (100 * nbInstalled / nbTotal) : 0;
      setProgress(percent, 'Instalando ' + nbInstalled + ' de ' + nbTotal);
    }
    function patchingStatusPatchApplied(fileName) {
      setProgress(100, 'Parche aplicado: ' + fileName, 'ready');
    }
    function notificationInProgress() {
      document.getElementById('status-text').innerText = 'La actualización ya está en curso';
    }
    function humanFileSize(size) {
      var units = ['B','KiB','MiB','GiB'];
      var i = size > 0 ? Math.floor(Math.log(size) / Math.log(1024)) : 0;
      return (size / Math.pow(1024, i)).toFixed(1) + ' ' + units[Math.min(i, units.length - 1)];
    }
    document.addEventListener('DOMContentLoaded', function () { external.invoke('start_update'); });
  </script>
</body>
</html>
